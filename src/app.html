<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#0E1628" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<!-- The hero h1 font (src/fonts.css), fetched with the CSS instead of after it: its late swap
		     re-wrapped the h1 and shifted the hero on phones (CLS 0.18). Sora isn't preloaded: it shifts
		     nothing, and on slow links the extra early bytes delayed the poster (the LCP image). -->
		<link rel="preload" href="%sveltekit.assets%/fonts/matcha-world.woff2" as="font" type="font/woff2" crossorigin />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
