# Builds the site image and publishes it to GHCR. The VPS pulls it: a timer on
# the box (hryer/vps-infra, madlabs-landing-poll-deploy) sees the new `:main`,
# reads its revision label, and runs deploy.sh (health gate + rollback).
# CI never connects to the box.
#
# Pull requests: svelte-check + build only, nothing pushed.
#
# Secret GH_PACKAGES_TOKEN: classic PAT with read:packages from an account that
# can read @hryer/madlabs-design-system (GITHUB_TOKEN cannot: the package is
# owned by a user, this repo by an org).
name: Build and publish

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/madlabs-landing-web

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          secrets: npm_token=${{ secrets.GH_PACKAGES_TOKEN }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          # poll-deploy.sh resolves `:main` to a commit through this label.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
